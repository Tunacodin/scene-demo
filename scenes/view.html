<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahne Kiti</title>
<style>
  :root { --bg: #e9edf1; --ink: #1d2733; --card: #ffffffee; --acc: #2f6fde; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #bar button { border: 0; border-radius: 14px; padding: 12px 18px; font-size: 17px; font-weight: 600; background: var(--card); color: var(--ink); cursor: pointer; }
  #bar button.on { background: var(--acc); color: #fff; }
  #scenes { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #scenes a { text-decoration: none; border-radius: 14px; padding: 10px 16px; font-size: 16px; font-weight: 600; background: var(--card); color: var(--ink); }
  #scenes a.on { background: var(--ink); color: #fff; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 600; pointer-events: none; }
</style>
<script type="importmap">{"imports":{"three":"../characters/three/three.module.js","three/addons/":"../characters/three/addons/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<nav id="scenes"></nav>
<div id="bar"></div>
<div id="load">Yükleniyor</div>
<script type="module">
import * as THREE from 'three';
import { makeRenderer, loadScene } from './scene-kit.js';

const SCENES = [['home', 'Ev'], ['kitchen', 'Mutfak'], ['market', 'Market'], ['park', 'Park'], ['school', 'Okul'], ['gym', 'Spor salonu']];
const q = new URLSearchParams(location.search), sid = q.get('s') || 'home';
const nav = document.getElementById('scenes');
for (const [id, name] of SCENES) {
  const a = document.createElement('a'); a.href = '?s=' + id; a.textContent = name; if (id === sid) a.className = 'on'; nav.append(a);
}
const canvas = document.getElementById('c'), renderer = makeRenderer(canvas);
const S = await loadScene(sid + '.json', renderer, f => document.getElementById('load').textContent = 'Yükleniyor ' + Math.round(f * 100) + '%');
document.getElementById('load').remove();
const C = S.recipe.camera || {};
const camera = new THREE.PerspectiveCamera(C.fov || 45, 1, 0.05, 200);
const target = new THREE.Vector3().fromArray(C.target || [0, 1, 0]);
const off = new THREE.Vector3().fromArray(C.pos || [0, 1.6, 5]).sub(target);
const sph = new THREE.Spherical().setFromVector3(off);

// variants: buttons that recolour tagged props and walls
const bar = document.getElementById('bar');
(S.recipe.variants || []).forEach((v, i) => {
  const b = document.createElement('button'); b.textContent = v.name;
  b.onclick = () => { S.setVariant(v); bar.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  if (i === 0) b.className = 'on';
  bar.append(b);
});

// drag to orbit, wheel / pinch to zoom
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  sph.theta -= (e.clientX - drag[0]) * 0.006; sph.phi = Math.min(1.5, Math.max(0.35, sph.phi - (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY];
});
canvas.addEventListener('wheel', e => { sph.radius = Math.min(14, Math.max(1.5, sph.radius * (1 + Math.sign(e.deltaY) * 0.1))); });

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  // portrait screens see less width: back off so the room still fits
  camera.fov = (C.fov || 45) * (w < h ? 1.45 : 1); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
const frame = dt => {
  camera.position.setFromSpherical(sph).add(target); camera.lookAt(target);
  S.update(camera, dt); renderer.render(S.scene, camera);
};
// ?shot=1: draw still frames and pin them as an <img> (headless screenshots miss WebGL frames
// and stall on an endless loop)
if (q.has('shot')) {
  for (let i = 0; i < 3; i++) frame(0.02);
  const img = new Image(); img.src = canvas.toDataURL('image/png');
  img.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh'; document.body.append(img); canvas.style.visibility = 'hidden';
}
else renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.05)));
</script>
</body>
</html>
